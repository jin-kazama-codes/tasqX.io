<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tasqx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="tasqx-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#tasqx-grad)"/>

  <!-- Subtle Inner Border -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="white" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Central T + X emblem -->
  <g filter="url(#glow)">
    <!-- Top Crossbar of 'T' -->
    <path d="M120 156 C120 145 129 136 140 136 L372 136 C383 136 392 145 392 156 L392 180 C392 191 383 200 372 200 L140 200 C129 200 120 191 120 180 Z" fill="url(#tasqx-accent)"/>
    
    <!-- Central Stem of 'T' transitioning into dynamic 'X' & Checkmark -->
    <path d="M228 200 L284 200 C295 200 304 209 304 220 L304 276 L376 364 C384 374 380 388 368 392 L344 398 C334 401 324 396 317 388 L256 314 L195 388 C188 396 178 401 168 398 L144 392 C132 388 128 374 136 364 L208 276 L208 220 C208 209 217 200 228 200 Z" fill="url(#tasqx-accent)"/>
  </g>

  <!-- Sparkle / AI Readiness Indicator Dot -->
  <circle cx="396" cy="136" r="22" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="396" cy="136" r="14" fill="#FFFFFF"/>
</svg>
